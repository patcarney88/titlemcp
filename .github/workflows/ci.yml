name: CI

# Every push to main and every pull request, including from forks. Without this
# a contributor opening a pull request gets no signal at all, and the maintainer
# has to run the suite locally to find out whether it is green.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a branch makes the run already in flight pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The jurisdiction catalog is six figures of small files and no test
          # reads its history.
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Held to one minor version. The formatter's output can change between
          # them, and an unpinned install would fail a pull request over layout
          # its author never touched.
          python -m pip install "ruff>=0.16,<0.17" hatchling hatch-vcs

      # Ruff is the project's linter and formatter, configured in pyproject:
      # line length 100, target py312, rules E,F,I,UP,B.
      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check --diff .

      - name: Test
        # Serial, offline contracts for core, platforms and every jurisdiction.
        # The runner uses checkout source and never downloads released local packages.
        run: python scripts/ci_packages.py --install

      - name: Package builds and its metadata is valid
        run: |
          python -m pip install build twine
          python -m build packages/titlemcp
          python -m twine check packages/titlemcp/dist/*

  image:
    # Validate the manual-build Dockerfile without publishing or deploying it.
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build
        # Explicit CI-only identity; never inferred from another package on PyPI.
        run: >-
          docker build --build-arg TITLEMCP_VERSION=0.3.7+ci.${{ github.sha }}
          --build-arg SOURCE_REVISION=${{ github.sha }} -t titlemcp:ci .

      - name: Serves on the port the platform gives it
        run: |
          docker run -d --name titlemcp -e PORT=10000 -p 127.0.0.1:10000:10000 \
          -e TITLE_MCP_MCP_ACCESS_TOKEN=synthetic-ci-instance-credential-0001 titlemcp:ci
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:10000/healthz && break
            sleep 1
          done
          curl -fs http://localhost:10000/healthz || { docker logs titlemcp; exit 1; }

      - name: Advertises the https endpoint behind a proxy
        run: |
          url=$(curl -fs -H "Authorization: Bearer synthetic-ci-instance-credential-0001" \
            -H "Host: titlemcp.example.com" -H "X-Forwarded-Proto: https" \
            http://localhost:10000/ | python -c "import json, sys; print(json.load(sys.stdin)['mcp']['url'])")
          echo "$url"
          test "$url" = "https://titlemcp.example.com/mcp"

      - name: Stop test container
        if: always()
        run: docker rm -f titlemcp || true
